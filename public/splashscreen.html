<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iAlarm — Interval Alarm</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #121316;
        color: #e3e2e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        user-select: none;
      }
      .logo-container {
        position: relative;
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 32px;
        background: radial-gradient(circle, rgba(200, 191, 255, 0.35) 0%, rgba(200, 191, 255, 0) 70%);
        filter: blur(14px);
        animation: pulse 2.4s ease-in-out infinite;
      }
      .logo-img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        object-fit: cover;
        position: relative;
        z-index: 1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: #c8bfff;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        margin-bottom: 6px;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
        color: #e3e2e6;
        letter-spacing: -0.02em;
        margin-bottom: 28px;
      }
      .loader {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(200, 191, 255, 0.15);
        border-top-color: #c8bfff;
        border-radius: 50%;
        animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <div class="logo-glow"></div>
      <img src="/interval_alarm_logo.png" alt="iAlarm" class="logo-img" />
    </div>
    <span class="eyebrow">Interval Alarm</span>
    <h1 class="title">iAlarm</h1>
    <div class="loader"></div>
  </body>
</html>
