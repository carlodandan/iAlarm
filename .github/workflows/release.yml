name: Build iAlarm Android App

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.11902837"

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Rust cargo-ndk
        run: cargo install cargo-ndk

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Initialize Android project
        run: pnpm tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Build Android APK
        run: pnpm tauri android build --target aarch64 --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837

      - name: Get version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Sign APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Recreate the signing keystore from GitHub Secret
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          # Locate Android build tools
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n 1)

          # Find the unsigned release APK
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk \
            -name "*unsigned.apk" | head -n 1)

          SIGNED_APK="src-tauri/gen/android/app/build/outputs/apk/iAlarm-v${{ steps.pkg.outputs.version }}.apk"

          echo "Found unsigned APK: $UNSIGNED_APK"

          # Align APK
          "$BUILD_TOOLS_DIR/zipalign" \
            -v -p 4 \
            "$UNSIGNED_APK" \
            "$RUNNER_TEMP/aligned.apk"

          # Sign APK
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_STORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$RUNNER_TEMP/aligned.apk"

          # Verify signature
          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            "$SIGNED_APK"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          files: src-tauri/gen/android/app/build/outputs/apk/iAlarm-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}